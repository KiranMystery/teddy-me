<text x="20" y="510" text-anchor="start" fill="#222" font-weight="bold">Notes</text>
<text x="20" y="530" text-anchor="start" fill="#444">• The PowerBoost’s micro-USB socket is the bear’s charging port. The ESP32’s own USB socket is only for flashing: switch the bear off with SW2 before plugging it into a computer.</text>
<text x="20" y="548" text-anchor="start" fill="#444">• SW2 joins EN to GND. Closed = bear off (the battery still charges). It only carries a signal, so a tiny slide switch is fine.</text>
<text x="20" y="566" text-anchor="start" fill="#444">• BT1 must be a protected single-cell LiPo with a JST-PH plug, and it must always be plugged in. The board charges at up to 1 A, so use a cell rated for that (typically 1000 mAh or more).</text>
<text x="20" y="584" text-anchor="start" fill="#444">• The motor now runs from the 5 V rail. R3 drops that to roughly 3 to 3.5 V for a 3 V coin motor; replace R3 with a wire link only if your motor is rated for 5 V.</text>
<text x="20" y="602" text-anchor="start" fill="#444">• D1 absorbs the motor’s switch-off spike. C1 goes across 5 V and GND on the carrier board, + leg to 5 V.</text>
<text x="20" y="620" text-anchor="start" fill="#444">• SW1 is any momentary push button between GPIO 27 and GND. No resistor: the ESP32’s internal pull-up is used.</text>
</svg>
