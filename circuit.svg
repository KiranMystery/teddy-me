<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">Teddy bear – ESP32 + LED + vibration motor</text>

  <!-- ESP32 -->
  <rect x="40" y="70" width="160" height="290" rx="8" fill="#f3f4f6" stroke="#333" stroke-width="2"/>
  <text x="120" y="100" text-anchor="middle" font-weight="bold" fill="#222">ESP32</text>
  <text x="120" y="118" text-anchor="middle" fill="#555">DevKit board</text>
  <text x="120" y="345" text-anchor="middle" fill="#555">USB 5V in</text>
  <!-- pin stubs + labels -->
  <g stroke="#333" stroke-width="2">
    <line x1="200" y1="110" x2="230" y2="110"/>
    <line x1="200" y1="190" x2="230" y2="190"/>
    <line x1="200" y1="260" x2="230" y2="260"/>
    <line x1="200" y1="330" x2="230" y2="330"/>
  </g>
  <text x="192" y="105" text-anchor="end" fill="#b91c1c" font-weight="bold">3V3</text>
  <text x="192" y="185" text-anchor="end" fill="#222" font-weight="bold">GPIO 26</text>
  <text x="192" y="255" text-anchor="end" fill="#222" font-weight="bold">GPIO 25</text>
  <text x="192" y="325" text-anchor="end" fill="#222" font-weight="bold">GND</text>

  <!-- 3V3 rail -->
  <line x1="230" y1="110" x2="730" y2="110" stroke="#b91c1c" stroke-width="2"/>
  <text x="738" y="114" fill="#b91c1c" font-weight="bold">+3.3 V</text>

  <!-- GND rail -->
  <line x1="230" y1="330" x2="230" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="230" y1="400" x2="730" y2="400" stroke="#333" stroke-width="2"/>
  <!-- ground symbol -->
  <g stroke="#333" stroke-width="2">
    <line x1="730" y1="400" x2="730" y2="415"/>
    <line x1="715" y1="415" x2="745" y2="415"/>
    <line x1="720" y1="421" x2="740" y2="421"/>
    <line x1="725" y1="427" x2="735" y2="427"/>
  </g>

  <!-- ===== MOTOR BRANCH (GPIO 26) ===== -->
  <line x1="230" y1="190" x2="260" y2="190" stroke="#333" stroke-width="2"/>
  <!-- R2 -->
  <rect x="260" y="182" width="70" height="16" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="295" y="175" text-anchor="middle" fill="#222">R2  1 kΩ</text>
  <line x1="330" y1="190" x2="535" y2="190" stroke="#333" stroke-width="2"/>
  <!-- Q1 NPN -->
  <circle cx="555" cy="190" r="26" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="545" y1="172" x2="545" y2="208" stroke="#333" stroke-width="3"/>
  <line x1="535" y1="190" x2="545" y2="190" stroke="#333" stroke-width="2"/>
  <!-- collector -->
  <line x1="545" y1="182" x2="570" y2="166" stroke="#333" stroke-width="2"/>
  <line x1="570" y1="166" x2="570" y2="160" stroke="#333" stroke-width="2"/>
  <!-- emitter with arrow -->
  <line x1="545" y1="198" x2="570" y2="214" stroke="#333" stroke-width="2"/>
  <polygon points="570,214 559,212 564,204" fill="#333"/>
  <line x1="570" y1="214" x2="570" y2="400" stroke="#333" stroke-width="2"/>
  <text x="520" y="236" text-anchor="end" fill="#222">Q1  2N2222 / BC337</text>
  <text x="520" y="252" text-anchor="end" fill="#555">(any small NPN)</text>
  <text x="520" y="214" text-anchor="end" fill="#555" font-size="11">B</text>
  <text x="578" y="170" fill="#555" font-size="11">C</text>
  <text x="578" y="226" fill="#555" font-size="11">E</text>

  <!-- node at collector -->
  <circle cx="570" cy="160" r="3.5" fill="#333"/>
  <line x1="570" y1="160" x2="570" y2="150" stroke="#333" stroke-width="2"/>
  <!-- Motor -->
  <circle cx="570" cy="130" r="20" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="570" y="135" text-anchor="middle" font-weight="bold" fill="#222">M</text>
  <line x1="570" y1="110" x2="570" y2="110" stroke="#333"/>
  <circle cx="570" cy="110" r="3.5" fill="#b91c1c"/>
  <text x="455" y="135" text-anchor="end" fill="#222">vibration motor</text>
  <text x="455" y="150" text-anchor="end" fill="#555">(+ wire to 3V3)</text>

  <!-- D1 flyback diode, in parallel with motor -->
  <line x1="570" y1="160" x2="625" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="625" y1="160" x2="625" y2="146" stroke="#333" stroke-width="2"/>
  <polygon points="615,146 635,146 625,128" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="615" y1="128" x2="635" y2="128" stroke="#333" stroke-width="3"/>
  <line x1="625" y1="128" x2="625" y2="110" stroke="#333" stroke-width="2"/>
  <circle cx="625" cy="110" r="3.5" fill="#b91c1c"/>
  <text x="640" y="182" fill="#222">D1  1N4148</text>
  <text x="640" y="197" fill="#555">stripe end up (to 3V3)</text>

  <!-- C1 optional -->
  <line x1="730" y1="110" x2="730" y2="245" stroke="#333" stroke-width="2"/>
  <line x1="718" y1="245" x2="742" y2="245" stroke="#333" stroke-width="3"/>
  <line x1="718" y1="255" x2="742" y2="255" stroke="#333" stroke-width="3"/>
  <line x1="730" y1="255" x2="730" y2="400" stroke="#333" stroke-width="2"/>
  <circle cx="730" cy="110" r="3.5" fill="#b91c1c"/>
  <text x="748" y="245" fill="#222">C1 100 µF</text>
  <text x="748" y="260" fill="#555">(optional, + up)</text>

  <!-- ===== LED BRANCH (GPIO 25) ===== -->
  <line x1="230" y1="260" x2="260" y2="260" stroke="#333" stroke-width="2"/>
  <rect x="260" y="252" width="70" height="16" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="295" y="245" text-anchor="middle" fill="#222">R1  220 Ω</text>
  <line x1="330" y1="260" x2="360" y2="260" stroke="#333" stroke-width="2"/>
  <!-- LED -->
  <polygon points="360,248 360,272 384,260" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="384" y1="248" x2="384" y2="272" stroke="#333" stroke-width="3"/>
  <g stroke="#d97706" stroke-width="1.5">
    <line x1="376" y1="246" x2="388" y2="234"/><polygon points="388,234 382,236 386,240" fill="#d97706"/>
    <line x1="384" y1="250" x2="396" y2="238"/><polygon points="396,238 390,240 394,244" fill="#d97706"/>
  </g>
  <line x1="384" y1="260" x2="420" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="420" y1="260" x2="420" y2="400" stroke="#333" stroke-width="2"/>
  <circle cx="420" cy="400" r="3.5" fill="#333"/>
  <circle cx="570" cy="400" r="3.5" fill="#333"/>
  <circle cx="730" cy="400" r="3.5" fill="#333"/>
  <text x="372" y="292" text-anchor="middle" fill="#222">LED</text>
  <text x="372" y="306" text-anchor="middle" fill="#555">long leg to R1</text>

  <!-- notes -->
  <text x="20" y="455" fill="#222" font-weight="bold">Notes</text>
  <text x="20" y="473" fill="#444">• The motor must NOT be wired straight to a GPIO pin – it draws far more current than the pin can supply. Q1 does the switching.</text>
  <text x="20" y="490" fill="#444">• D1 absorbs the voltage spike the motor makes when it switches off. C1 helps stop the ESP32 rebooting when the motor kicks in.</text>
  <text x="20" y="507" fill="#444">• Add more LEDs: one per GPIO with its own 220 Ω, or several motors: one transistor stage each (R2, Q1, D1) on separate GPIOs.</text>
</svg>
