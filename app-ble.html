<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b1d14">
<title>Teddy (Bluetooth)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #2b1d14; color: #fff4e6;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 24px 16px; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; touch-action: manipulation;
  }
  h1 { margin: 0; font-size: 28px; font-weight: 700; }
  #status { font-size: 14px; opacity: .75; min-height: 1.2em; text-align: center; }
  #status.bad { color: #ff9b8a; opacity: 1; }
  .connect {
    padding: 14px 28px; border-radius: 999px; border: none; cursor: pointer;
    background: #4f8ef7; color: #fff; font-size: 18px; font-weight: 700;
  }
  .connect.linked { background: #3b2a1e; color: #e8d5c0; border: 2px solid #7a5a3e; font-size: 14px; padding: 8px 18px; }
  .buzz {
    width: 220px; height: 220px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #d9985a, #a2642f 70%);
    box-shadow: 0 12px 30px rgba(0,0,0,.45), inset 0 -6px 14px rgba(0,0,0,.25);
    color: #fff; font-size: 20px; font-weight: 700; line-height: 1.3;
    touch-action: none; transition: transform .08s, box-shadow .08s, background .08s;
  }
  .buzz .big { display: block; font-size: 56px; }
  .buzz.on {
    transform: scale(.94);
    background: radial-gradient(circle at 35% 30%, #ffb46e, #d47a2a 70%);
    box-shadow: 0 4px 10px rgba(0,0,0,.45), 0 0 40px rgba(255,170,90,.6);
    animation: wobble .12s infinite;
  }
  @keyframes wobble { 0%{transform:scale(.94) rotate(-2deg)} 50%{transform:scale(.94) rotate(2deg)} 100%{transform:scale(.94) rotate(-2deg)} }
  .light {
    width: 220px; padding: 18px 0; border-radius: 999px; border: 2px solid #7a5a3e; cursor: pointer;
    background: #3b2a1e; color: #e8d5c0; font-size: 20px; font-weight: 700;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .light.on { background: #ffd978; color: #2b1d14; border-color: #ffd978; box-shadow: 0 0 36px rgba(255,217,120,.7); }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .controls.off { opacity: .35; pointer-events: none; }
  .hint { font-size: 13px; opacity: .6; text-align: center; max-width: 280px; line-height: 1.4; }
  .nobt { background: #4a2a2a; border: 1px solid #a04a4a; border-radius: 12px; padding: 14px; font-size: 14px; max-width: 320px; line-height: 1.45; }
  .nobt b { color: #ffb4a4; }
</style>
</head>
<body oncontextmenu="return false">
  <h1>🧸 Teddy</h1>
  <div id="status">not connected</div>
  <button class="connect" id="connect">Connect to bear</button>

  <div class="controls off" id="controls">
    <button class="buzz" id="buzz"><span class="big">🐾</span>hold to<br>buzz</button>
    <button class="light" id="light">💡 Light: off</button>
  </div>

  <p class="hint">Press and hold the paw to make the bear vibrate. Tap the light to toggle it.</p>

<script>
  // Must match teddy_bear_ble.ino
  const SERVICE_UUID = '0e7a1000-7edd-4bea-a000-5eed12345678';
  const MOTOR_UUID   = '0e7a1001-7edd-4bea-a000-5eed12345678';
  const LED_UUID     = '0e7a1002-7edd-4bea-a000-5eed12345678';

  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connect');
  const controls = document.getElementById('controls');
  const buzz = document.getElementById('buzz');
  const light = document.getElementById('light');

  let device = null, motorChr = null, ledChr = null, ledOn = false;

  function setStatus(text, bad) { statusEl.textContent = text; statusEl.classList.toggle('bad', !!bad); }
  function renderLed(on) {
    ledOn = on;
    light.classList.toggle('on', on);
    light.textContent = '💡 Light: ' + (on ? 'on' : 'off');
  }
  function setLinked(linked) {
    controls.classList.toggle('off', !linked);
    connectBtn.classList.toggle('linked', linked);
    connectBtn.textContent = linked ? 'Disconnect' : 'Connect to bear';
  }

  if (!navigator.bluetooth) {
    connectBtn.style.display = 'none';
    const n = document.createElement('div');
    n.className = 'nobt';
    n.innerHTML = '<b>This browser can\'t do Bluetooth.</b><br>' +
      'Use <b>Chrome</b> on Android, Mac or Windows.<br>' +
      'On iPhone, open this page in the free <b>Bluefy</b> browser app (Safari doesn\'t support Web Bluetooth).';
    statusEl.after(n);
  }

  async function connect() {
    try {
      setStatus('choose "Teddy" in the list…');
      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);
      setStatus('connecting…');
      const server = await device.gatt.connect();
      const svc = await server.getPrimaryService(SERVICE_UUID);
      motorChr = await svc.getCharacteristic(MOTOR_UUID);
      ledChr   = await svc.getCharacteristic(LED_UUID);

      const v = await ledChr.readValue();
      renderLed(v.byteLength > 0 && v.getUint8(0) !== 0);
      await ledChr.startNotifications();
      ledChr.addEventListener('characteristicvaluechanged', e => {
        const d = e.target.value;
        renderLed(d.byteLength > 0 && d.getUint8(0) !== 0);
      });

      setLinked(true);
      setStatus('connected to ' + (device.name || 'bear'));
    } catch (e) {
      console.error(e);
      setStatus(e.name === 'NotFoundError' ? 'no bear chosen' : ('couldn\'t connect: ' + e.message), true);
      cleanup();
    }
  }

  function cleanup() {
    stopBuzz(true);
    motorChr = ledChr = null;
    setLinked(false);
  }
  function onDisconnected() {
    cleanup();
    setStatus('bear disconnected', true);
  }
  function disconnect() {
    if (device && device.gatt.connected) device.gatt.disconnect();
    cleanup();
    setStatus('not connected');
  }
  connectBtn.addEventListener('click', () => (device && device.gatt.connected) ? disconnect() : connect());

  // --- writing to the bear ---
  // Serialise writes: Web Bluetooth rejects a write while another is in flight.
  let writeChain = Promise.resolve();
  function write(chr, byte) {
    if (!chr) return;
    writeChain = writeChain.then(async () => {
      try {
        const data = new Uint8Array([byte]);
        if (chr.writeValueWithoutResponse) await chr.writeValueWithoutResponse(data);
        else await chr.writeValue(data);
      } catch (e) { console.warn('write failed', e); }
    });
  }

  // --- Hold-to-buzz ---
  // While held we re-send "1" every 400 ms; the bear switches the motor off
  // by itself if it stops hearing from us, so a dropped "0" can't leave it buzzing.
  let holdTimer = null;
  function startBuzz(e) {
    e.preventDefault();
    if (holdTimer || !motorChr) return;
    try { buzz.setPointerCapture(e.pointerId); } catch (_) {}
    buzz.classList.add('on');
    write(motorChr, 1);
    holdTimer = setInterval(() => write(motorChr, 1), 400);
  }
  function stopBuzz(silent) {
    if (!holdTimer) return;
    clearInterval(holdTimer); holdTimer = null;
    buzz.classList.remove('on');
    if (!silent) write(motorChr, 0);
  }
  buzz.addEventListener('pointerdown', startBuzz);
  buzz.addEventListener('pointerup', () => stopBuzz());
  buzz.addEventListener('pointercancel', () => stopBuzz());
  window.addEventListener('blur', () => stopBuzz());
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopBuzz(); });

  // --- Light toggle ---
  light.addEventListener('click', () => { if (ledChr) { renderLed(!ledOn); write(ledChr, ledOn ? 1 : 0); } });
</script>
</body>
</html>
