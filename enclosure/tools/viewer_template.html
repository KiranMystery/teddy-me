<style>
  :root {
    --bg: #eef0f3; --panel: #ffffffee; --ink: #1c2026; --muted: #5d6673; --line: #d5d9df;
    --accent: #c2410c; --chip: #f3f4f6; --lead: #39414d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light) { --bg: #15181d; --panel: #1f242bee; --ink: #e8ebef; --muted: #9aa4b1; --line: #343b45;
            --accent: #fb923c; --chip: #2a3038; --lead: #c9d1db; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #callouts { position: fixed; inset: 0; pointer-events: none; }
  #callouts svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #callouts line { stroke: var(--lead); stroke-width: 1; opacity: .7; }
  #callouts circle { fill: var(--lead); }
  .tag { position: absolute; white-space: nowrap; padding: 1px 6px; border-radius: 4px; font-size: 12px;
    background: var(--panel); border: 1px solid var(--line); transform: translateY(-50%); }
  #panel { position: fixed; top: 12px; left: 12px; width: 268px; max-height: calc(100% - 24px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(6px); }
  #panel h1 { font-size: 15px; margin: 0 0 2px; }
  #panel p { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  #panel h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 5px; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; }
  button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .seg span { width: 62px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 7px; padding: 2px 4px; border-radius: 5px; cursor: pointer; }
  li:hover, li.hot { background: var(--chip); }
  li.off { opacity: .4; }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0003; flex: none; }
  .sw.wire { height: 4px; border-radius: 2px; width: 18px; }
  #tip { position: fixed; pointer-events: none; padding: 3px 8px; border-radius: 5px; background: var(--ink);
    color: var(--bg); font-size: 12px; display: none; z-index: 5; }
  #hint { position: fixed; right: 14px; bottom: 10px; color: var(--muted); font-size: 12px; }
  body.shot #panel, body.shot #hint { display: none; }
  @media (max-width: 700px) { #panel { width: auto; right: 12px; max-height: 42%; } }
</style>

<body>
<div id="stage"></div>
<div id="callouts"><svg></svg></div>
<div id="panel">
  <h1>__TITLE__</h1>
  <p>Everything wired inside the printed box. Drag to rotate, scroll to zoom, right-drag to pan.</p>
  <h2>View</h2>
  <div class="row" id="views"></div>
  <h2>Show</h2>
  <div class="seg"><span>Body</span><div class="row" data-opt="body"></div></div>
  <div class="seg"><span>Lid</span><div class="row" data-opt="lid"></div></div>
  <div class="seg"><span>Carrier</span><div class="row" data-opt="carrier"></div></div>
  <div class="seg"><span>Labels</span><div class="row" data-opt="labels"></div></div>
  <h2>Wires</h2>
  <ul id="wires"></ul>
  <h2>Parts</h2>
  <ul id="parts"></ul>
</div>
<div id="tip"></div>
<div id="hint">teddy-me enclosure, generated from assembly.scad</div>

<script>/*__THREE__*/</script>
<script>
"use strict";
const PARTS = /*__PARTS__*/null;

// ---------- options (also settable from the URL hash, used for the PNG renders) ----------
const opt = { view: "iso", body: "solid", lid: "hide", carrier: "show", labels: "on", ui: "1", theme: "auto", zoom: "1" };
for (const kv of location.hash.slice(1).split("&")) {
  const [k, v] = kv.split("="); if (k in opt && v) opt[k] = v;
}
if (opt.ui === "0") document.body.classList.add("shot");
if (opt.theme === "light") document.documentElement.classList.add("light");
const CHOICES = { body: ["solid", "ghost", "hide"], lid: ["hide", "ghost", "solid"],
                  carrier: ["show", "see-through", "hide"], labels: ["on", "off"] };

// ---------- scene ----------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const dark = matchMedia("(prefers-color-scheme: dark)");
const setBg = () => scene.background = new THREE.Color(dark.matches && opt.theme !== "light" ? 0x15181d : 0xeef0f3);
setBg(); dark.addEventListener("change", setBg);
const camera = new THREE.PerspectiveCamera(32, 1, 1, 2000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.12;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(-120, -160, 260); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(200, 120, 80); scene.add(fill);
const head = new THREE.DirectionalLight(0xffffff, 0.55); camera.add(head); scene.add(camera);  // follows the view

const b64 = (s, T) => { const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); };
const meshes = {};
for (const p of PARTS) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(b64(p.v, Float32Array), 3));
  g.setIndex(new THREE.BufferAttribute(b64(p.i, Uint32Array), 1));
  const wire = p.group === "wires";
  if (wire) g.computeVertexNormals();
  g.computeBoundingBox();
  const m = new THREE.MeshStandardMaterial({ color: p.colour, roughness: wire ? 0.55 : 0.78,
    metalness: /usb|shield|screw|motor/.test(p.name) ? 0.45 : 0.04, flatShading: !wire });
  const mesh = new THREE.Mesh(g, m);
  mesh.userData = p; p.mesh = mesh; p.on = p.group !== "check"; p.base = new THREE.Color(p.colour);
  meshes[p.name] = mesh; scene.add(mesh);
}
const bodyBox = meshes.body.geometry.boundingBox;
const centre = bodyBox.getCenter(new THREE.Vector3());
const size = bodyBox.getSize(new THREE.Vector3());

// ---------- visibility ----------
function style(mesh, mode) {           // solid | ghost / see-through | hide
  const m = mesh.material, ghost = mode === "ghost" || mode === "see-through";
  mesh.visible = mode !== "hide";
  m.transparent = ghost; m.opacity = ghost ? (mesh.userData.name === "perfboard" ? 0.45 : 0.22) : 1;
  m.depthWrite = !ghost; mesh.renderOrder = ghost ? 2 : 0; m.needsUpdate = true;
}
function apply() {
  for (const p of PARTS) {
    let mode = p.on ? "solid" : "hide";
    if (p.name === "body") mode = opt.body;
    else if (p.name === "lid") mode = opt.lid;
    else if (p.name === "lid_screws") mode = opt.lid === "hide" ? "hide" : "solid";
    else if (p.group === "carrier" && p.on) mode = opt.carrier === "show" ? "solid" : opt.carrier;
    if (p.name === "perfboard" && p.on && opt.carrier === "show") mode = "see-through";
    style(p.mesh, mode);
  }
  for (const el of document.querySelectorAll("[data-opt] button"))
    el.classList.toggle("on", opt[el.parentNode.dataset.opt] === el.textContent);
  for (const li of document.querySelectorAll("li[data-name]"))
    li.classList.toggle("off", !meshes[li.dataset.name].userData.on);
}

// ---------- camera presets ----------
const VIEWS = {
  iso:    { dir: [-0.62, -0.95, 0.95], label: "Overview" },
  top:    { dir: [0, -0.001, 1],       label: "Top" },
  ports:  { dir: [-1, -0.28, 0.32],    label: "Port side" },
  leads:  { dir: [1, -0.55, 0.75],     label: "Lead exits" },
  power:  { dir: [-0.35, 0.9, 1.1],    label: "Battery side" },
  below:  { dir: [0, 0.35, -1],        label: "Underside" },
};
function setView(name) {
  const v = VIEWS[name] || VIEWS.iso; opt.view = name;
  const d = new THREE.Vector3(...v.dir).normalize();
  const fit = Math.max(size.x, size.y, size.z) * (name === "top" ? 2.9 : 3.1) / (parseFloat(opt.zoom) || 1);
  const tgt = centre.clone(); if (name !== "ports") tgt.x += size.x * 0.2;
  controls.target.copy(tgt); camera.position.copy(tgt).addScaledVector(d, fit); controls.update();
  for (const el of document.querySelectorAll("#views button")) el.classList.toggle("on", el.dataset.v === name);
}

// ---------- panel ----------
for (const [k, v] of Object.entries(VIEWS)) {
  const b = document.createElement("button"); b.textContent = v.label; b.dataset.v = k;
  b.onclick = () => {
    if (k === "below") { opt.body = "hide"; } else if (opt.body === "hide") opt.body = "solid";
    setView(k); apply(); };
  document.getElementById("views").appendChild(b);
}
for (const row of document.querySelectorAll("[data-opt]")) for (const c of CHOICES[row.dataset.opt]) {
  const b = document.createElement("button"); b.textContent = c;
  b.onclick = () => { opt[row.dataset.opt] = c; apply(); }; row.appendChild(b);
}
for (const p of PARTS) {
  if (!p.label || p.group === "box") continue;
  const li = document.createElement("li"); li.dataset.name = p.name;
  li.innerHTML = `<span class="sw ${p.group === "wires" ? "wire" : ""}" style="background:${p.colour}"></span><span></span>`;
  li.lastChild.textContent = p.label;
  li.onclick = () => { p.on = !p.on; apply(); };
  li.onmouseenter = () => hot(p.name); li.onmouseleave = () => hot(null);
  document.getElementById(p.group === "wires" ? "wires" : "parts").appendChild(li);
}

// ---------- hover ----------
const tip = document.getElementById("tip"), ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let hotName = null;
function hot(name) {
  if (name === hotName) return; hotName = name;
  for (const p of PARTS) {
    p.mesh.material.emissive.set(p.name === name ? 0x553300 : 0x000000);
    p.mesh.material.emissiveIntensity = p.name === name ? 0.9 : 0;
  }
  for (const li of document.querySelectorAll("li[data-name]")) li.classList.toggle("hot", li.dataset.name === name);
}
renderer.domElement.addEventListener("pointermove", e => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(PARTS.filter(p => p.mesh.visible && p.mesh.material.opacity > 0.5)
                                        .map(p => p.mesh))[0];
  const p = hit && hit.object.userData;
  const owner = p && (p.label ? p : PARTS.find(q => q.label && q.name.split("_")[0] === p.name.split("_")[0]));
  if (owner) { tip.textContent = owner.label; tip.style.display = "block";
    tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 12 + "px"; hot(p.name); }
  else { tip.style.display = "none"; hot(null); }
});
renderer.domElement.addEventListener("pointerleave", () => { tip.style.display = "none"; hot(null); });

// ---------- callout labels ----------
const co = document.getElementById("callouts"), svg = co.querySelector("svg");
const tags = PARTS.filter(p => p.label && !["box", "wires", "check"].includes(p.group) && p.name !== "screws_m2")
  .map(p => { const el = document.createElement("div"); el.className = "tag"; el.textContent = p.label;
              co.appendChild(el);
              const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
              const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              dot.setAttribute("r", 2.5); svg.append(ln, dot);
              return { p, el, ln, dot, c: p.mesh.geometry.boundingBox.getCenter(new THREE.Vector3()) }; });
function layoutTags() {
  const w = stage.clientWidth, h = stage.clientHeight, v = new THREE.Vector3();
  const panelW = document.body.classList.contains("shot") || w < 700 ? 0 : 290;
  const live = [];
  for (const t of tags) {
    const vis = opt.labels === "on" && t.p.mesh.visible;
    v.copy(t.c).project(camera);
    t.x = (v.x + 1) / 2 * w; t.y = (1 - v.y) / 2 * h;
    const show = vis && v.z < 1 && t.x > 0 && t.x < w && t.y > 0 && t.y < h;
    t.el.style.display = show ? "block" : "none";
    t.ln.style.display = t.dot.style.display = show ? "block" : "none";
    if (show) live.push(t);
  }
  const mid = (panelW + w) / 2;
  for (const side of [-1, 1]) {
    const col = live.filter(t => (t.x < mid ? -1 : 1) === side).sort((a, b) => a.y - b.y);
    const gap = 22, top = 16, bottom = h - 16;
    let y = top;
    for (const t of col) { t.ly = Math.max(y, t.y); y = t.ly + gap; }       // push down
    y = bottom;
    for (let i = col.length - 1; i >= 0; i--) { col[i].ly = Math.min(col[i].ly, y); y = col[i].ly - gap; }  // push up
    for (const t of col) {
      const tw = t.el.offsetWidth, edge = side < 0 ? panelW + 14 : w - 14;
      const lx = side < 0 ? edge : edge - tw;
      t.el.style.left = lx + "px"; t.el.style.top = t.ly + "px";
      t.ln.setAttribute("x1", side < 0 ? lx + tw : lx); t.ln.setAttribute("y1", t.ly);
      t.ln.setAttribute("x2", t.x); t.ln.setAttribute("y2", t.y);
      t.dot.setAttribute("cx", t.x); t.dot.setAttribute("cy", t.y);
    }
  }
}

// ---------- run ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
if (opt.view === "below" && !/body=/.test(location.hash)) opt.body = "hide";
setView(opt.view); apply();
let frames = 0;
(function loop() {
  controls.update(); renderer.render(scene, camera); layoutTags();
  if (++frames === 3) document.title = document.title + " ";   // settled: lets headless capture know
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
